name: Supabase Migration

on:
  push:
    branches:
      - develop
    paths:
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations
        run: |
          supabase link --db-url postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.xtcmoqlsqephzgiymrkz.supabase.co:5432/postgres?project_id=${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
